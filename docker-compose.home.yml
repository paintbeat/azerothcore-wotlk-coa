# Portainer-friendly, LAN-only deployment for the Conquest of Azeroth fork.
# Select this file as the repository Compose path and provide the variables
# documented in home-server.env.example through Portainer's stack UI.

x-ac-build: &ac-build
  context: .
  dockerfile: apps/docker/Dockerfile
  args:
    BUILD_JOBS: ${COA_BUILD_JOBS:-4}
    USER_ID: ${COA_USER_ID:-1000}
    GROUP_ID: ${COA_GROUP_ID:-1000}
    DOCKER_USER: ${COA_DOCKER_USER:-acore}

x-ac-database-environment: &ac-database-environment
  AC_LOGIN_DATABASE_INFO: database;3306;root;${COA_DB_ROOT_PASSWORD:?Set COA_DB_ROOT_PASSWORD};acore_auth
  AC_WORLD_DATABASE_INFO: database;3306;root;${COA_DB_ROOT_PASSWORD:?Set COA_DB_ROOT_PASSWORD};acore_world
  AC_CHARACTER_DATABASE_INFO: database;3306;root;${COA_DB_ROOT_PASSWORD:?Set COA_DB_ROOT_PASSWORD};acore_characters

services:
  database:
    container_name: coa-database
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${COA_DB_ROOT_PASSWORD:?Set COA_DB_ROOT_PASSWORD}
    volumes:
      - ${COA_DATA_ROOT:-/srv/azerothcore}/mysql:/var/lib/mysql
    networks:
      - coa-network
    restart: unless-stopped
    mem_limit: ${COA_DB_MEMORY_LIMIT:-1536m}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 20s

  coa-world-bootstrap:
    container_name: coa-world-bootstrap
    image: paintbeat/coa-world-bootstrap:${COA_IMAGE_TAG:-local}
    build:
      <<: *ac-build
      target: coa-world-bootstrap
    environment:
      COA_DB_HOST: database
      COA_DB_ROOT_PASSWORD: ${COA_DB_ROOT_PASSWORD:?Set COA_DB_ROOT_PASSWORD}
      COA_WORLD_DATABASE: acore_world
    networks:
      - coa-network
    depends_on:
      database:
        condition: service_healthy

  db-import:
    container_name: coa-db-import
    image: paintbeat/coa-db-import:${COA_IMAGE_TAG:-local}
    build:
      <<: *ac-build
      target: db-import
    environment:
      <<: *ac-database-environment
      AC_DATA_DIR: /azerothcore/env/dist/data
      AC_LOGS_DIR: /azerothcore/env/dist/logs
    volumes:
      - ${COA_DATA_ROOT:-/srv/azerothcore}/etc:/azerothcore/env/dist/etc
      - ${COA_DATA_ROOT:-/srv/azerothcore}/logs:/azerothcore/env/dist/logs
    networks:
      - coa-network
    depends_on:
      database:
        condition: service_healthy
      coa-world-bootstrap:
        condition: service_completed_successfully

  client-data:
    container_name: coa-client-data
    image: paintbeat/coa-client-data:${COA_IMAGE_TAG:-local}
    build:
      <<: *ac-build
      target: client-data
    volumes:
      - ${COA_DATA_ROOT:-/srv/azerothcore}/data:/azerothcore/env/dist/data
    networks:
      - coa-network

  ascension-dbc-check:
    container_name: coa-ascension-dbc-check
    image: paintbeat/coa-world-bootstrap:${COA_IMAGE_TAG:-local}
    build:
      <<: *ac-build
      target: coa-world-bootstrap
    command: ["bash", "/azerothcore/apps/coa-world/docker-verify-ascension-dbc.sh"]
    environment:
      COA_SERVER_DATA_DIR: /azerothcore/env/dist/data
    volumes:
      - ${COA_DATA_ROOT:-/srv/azerothcore}/data:/azerothcore/env/dist/data:ro
    networks:
      - coa-network
    depends_on:
      client-data:
        condition: service_completed_successfully

  realm-config:
    container_name: coa-realm-config
    image: paintbeat/coa-world-bootstrap:${COA_IMAGE_TAG:-local}
    build:
      <<: *ac-build
      target: coa-world-bootstrap
    command: ["bash", "/azerothcore/apps/coa-world/docker-configure-realm.sh"]
    environment:
      COA_DB_HOST: database
      COA_DB_ROOT_PASSWORD: ${COA_DB_ROOT_PASSWORD:?Set COA_DB_ROOT_PASSWORD}
      COA_REALM_NAME: ${COA_REALM_NAME:-Conquest of Azeroth}
      COA_REALM_ADDRESS: ${COA_REALM_ADDRESS:?Set COA_REALM_ADDRESS to the Docker VM LAN address}
      COA_REALM_LOCAL_ADDRESS: ${COA_REALM_LOCAL_ADDRESS:?Set COA_REALM_LOCAL_ADDRESS to the Docker VM LAN address}
      COA_REALM_LOCAL_SUBNET_MASK: ${COA_REALM_LOCAL_SUBNET_MASK:-255.255.255.0}
      COA_WORLD_PORT: ${COA_WORLD_PORT:-8085}
    networks:
      - coa-network
    depends_on:
      db-import:
        condition: service_completed_successfully

  authserver:
    container_name: coa-authserver
    image: paintbeat/coa-authserver:${COA_IMAGE_TAG:-local}
    build:
      <<: *ac-build
      target: authserver
    env_file:
      - conf/dist/env.ac
    environment:
      AC_LOGIN_DATABASE_INFO: database;3306;root;${COA_DB_ROOT_PASSWORD:?Set COA_DB_ROOT_PASSWORD};acore_auth
      AC_LOGS_DIR: /azerothcore/env/dist/logs
      AC_TEMP_DIR: /azerothcore/env/dist/temp
    ports:
      - ${COA_BIND_IP:?Set COA_BIND_IP to the Docker VM LAN address}:${COA_AUTH_PORT:-3724}:3724
    volumes:
      - ${COA_DATA_ROOT:-/srv/azerothcore}/etc:/azerothcore/env/dist/etc
      - ${COA_DATA_ROOT:-/srv/azerothcore}/logs:/azerothcore/env/dist/logs
    networks:
      - coa-network
    restart: unless-stopped
    mem_limit: ${COA_AUTH_MEMORY_LIMIT:-512m}
    depends_on:
      database:
        condition: service_healthy
      realm-config:
        condition: service_completed_successfully

  worldserver:
    container_name: coa-worldserver
    image: paintbeat/coa-worldserver:${COA_IMAGE_TAG:-local}
    build:
      <<: *ac-build
      target: worldserver
    env_file:
      - conf/dist/env.ac
    environment:
      <<: *ac-database-environment
      AC_DATA_DIR: /azerothcore/env/dist/data
      AC_LOGS_DIR: /azerothcore/env/dist/logs
      AC_ASCENSION_COMPAT_ALLOW_REMOTE_CLIENTS: "1"
      AC_ASCENSION_COMPAT_DBC_DIRECTORY: /azerothcore/env/dist/data/dbc/Ascension
      AC_ASCENSION_COMPAT_LOG_CONSUMED_PACKETS: "0"
    ports:
      - ${COA_BIND_IP:?Set COA_BIND_IP to the Docker VM LAN address}:${COA_WORLD_PORT:-8085}:8085
    volumes:
      - ${COA_DATA_ROOT:-/srv/azerothcore}/etc:/azerothcore/env/dist/etc
      - ${COA_DATA_ROOT:-/srv/azerothcore}/logs:/azerothcore/env/dist/logs
      - ${COA_DATA_ROOT:-/srv/azerothcore}/data:/azerothcore/env/dist/data:ro
    networks:
      - coa-network
    stdin_open: true
    tty: true
    restart: unless-stopped
    mem_limit: ${COA_WORLD_MEMORY_LIMIT:-3g}
    depends_on:
      database:
        condition: service_healthy
      ascension-dbc-check:
        condition: service_completed_successfully
      realm-config:
        condition: service_completed_successfully

networks:
  coa-network:
    name: coa-network
