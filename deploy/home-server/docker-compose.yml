services:
  ac-database:
    container_name: coa-database
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${COA_DB_ROOT_PASSWORD:?Set COA_DB_ROOT_PASSWORD in Portainer}
    volumes:
      - ${COA_ROOT:-/srv/azerothcore-coa}/database:/var/lib/mysql
    networks:
      - coa-network
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s

  coa-world-bootstrap:
    container_name: coa-world-bootstrap
    image: paintbeat/coa-world-bootstrap:${COA_IMAGE_TAG:-home}
    build:
      context: ../..
      dockerfile: deploy/home-server/Dockerfile.bootstrap
    environment:
      MYSQL_HOST: ac-database
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: acore_world
      MYSQL_ROOT_PASSWORD: ${COA_DB_ROOT_PASSWORD:?Set COA_DB_ROOT_PASSWORD in Portainer}
    networks:
      - coa-network
    depends_on:
      ac-database:
        condition: service_healthy
    restart: "no"

  ac-db-import:
    container_name: coa-db-import
    image: paintbeat/coa-db-import:${COA_IMAGE_TAG:-home}
    build:
      context: ../..
      dockerfile: apps/docker/Dockerfile
      target: db-import
      args:
        TZ: ${TZ:-America/Chicago}
        USER_ID: ${DOCKER_USER_ID:-1000}
        GROUP_ID: ${DOCKER_GROUP_ID:-1000}
        DOCKER_USER: ${DOCKER_USER:-acore}
    env_file:
      - ../../conf/dist/env.ac
    environment:
      AC_DATA_DIR: /azerothcore/env/dist/data
      AC_LOGS_DIR: /azerothcore/env/dist/logs
      AC_LOGIN_DATABASE_INFO: ac-database;3306;root;${COA_DB_ROOT_PASSWORD};acore_auth
      AC_WORLD_DATABASE_INFO: ac-database;3306;root;${COA_DB_ROOT_PASSWORD};acore_world
      AC_CHARACTER_DATABASE_INFO: ac-database;3306;root;${COA_DB_ROOT_PASSWORD};acore_characters
    volumes:
      - ${COA_ROOT:-/srv/azerothcore-coa}/etc:/azerothcore/env/dist/etc
      - ${COA_ROOT:-/srv/azerothcore-coa}/logs:/azerothcore/env/dist/logs
    networks:
      - coa-network
    depends_on:
      ac-database:
        condition: service_healthy
      coa-world-bootstrap:
        condition: service_completed_successfully
    restart: "no"

  ac-client-data-init:
    container_name: coa-client-data-init
    image: paintbeat/coa-client-data:${COA_IMAGE_TAG:-home}
    build:
      context: ../..
      dockerfile: apps/docker/Dockerfile
      target: client-data
      args:
        TZ: ${TZ:-America/Chicago}
        USER_ID: ${DOCKER_USER_ID:-1000}
        GROUP_ID: ${DOCKER_GROUP_ID:-1000}
        DOCKER_USER: ${DOCKER_USER:-acore}
    volumes:
      - ${COA_ROOT:-/srv/azerothcore-coa}/client-data:/azerothcore/env/dist/data
    restart: "no"

  ac-authserver:
    profiles:
      - server
    container_name: coa-authserver
    image: paintbeat/coa-authserver:${COA_IMAGE_TAG:-home}
    build:
      context: ../..
      dockerfile: apps/docker/Dockerfile
      target: authserver
      args:
        TZ: ${TZ:-America/Chicago}
        USER_ID: ${DOCKER_USER_ID:-1000}
        GROUP_ID: ${DOCKER_GROUP_ID:-1000}
        DOCKER_USER: ${DOCKER_USER:-acore}
    env_file:
      - ../../conf/dist/env.ac
    environment:
      AC_LOGS_DIR: /azerothcore/env/dist/logs
      AC_TEMP_DIR: /azerothcore/env/dist/temp
      AC_LOGIN_DATABASE_INFO: ac-database;3306;root;${COA_DB_ROOT_PASSWORD};acore_auth
    ports:
      - ${COA_BIND_ADDRESS:-0.0.0.0}:${COA_AUTH_PORT:-3724}:3724
    volumes:
      - ${COA_ROOT:-/srv/azerothcore-coa}/etc:/azerothcore/env/dist/etc
      - ${COA_ROOT:-/srv/azerothcore-coa}/logs:/azerothcore/env/dist/logs
    networks:
      - coa-network
    depends_on:
      ac-database:
        condition: service_healthy
      ac-db-import:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 1m

  ac-worldserver:
    profiles:
      - server
    container_name: coa-worldserver
    image: paintbeat/coa-worldserver:${COA_IMAGE_TAG:-home}
    build:
      context: ../..
      dockerfile: apps/docker/Dockerfile
      target: worldserver
      args:
        TZ: ${TZ:-America/Chicago}
        USER_ID: ${DOCKER_USER_ID:-1000}
        GROUP_ID: ${DOCKER_GROUP_ID:-1000}
        DOCKER_USER: ${DOCKER_USER:-acore}
    env_file:
      - ../../conf/dist/env.ac
    environment:
      AC_DATA_DIR: /azerothcore/env/dist/data
      AC_LOGS_DIR: /azerothcore/env/dist/logs
      AC_LOGIN_DATABASE_INFO: ac-database;3306;root;${COA_DB_ROOT_PASSWORD};acore_auth
      AC_WORLD_DATABASE_INFO: ac-database;3306;root;${COA_DB_ROOT_PASSWORD};acore_world
      AC_CHARACTER_DATABASE_INFO: ac-database;3306;root;${COA_DB_ROOT_PASSWORD};acore_characters
      AC_ASCENSION_COMPAT_ENABLE: "1"
      AC_ASCENSION_COMPAT_ALLOW_REMOTE_CLIENTS: "1"
      AC_ASCENSION_COMPAT_PLAINTEXT_WORLD_HEADERS: "1"
      AC_ASCENSION_COMPAT_DBC_DIRECTORY: /azerothcore/env/dist/data/dbc/Ascension
      AC_ASCENSION_COMPAT_LOG_CONSUMED_PACKETS: "0"
      AC_SOAP_ENABLED: "0"
    ports:
      - ${COA_BIND_ADDRESS:-0.0.0.0}:${COA_WORLD_PORT:-8085}:8085
    volumes:
      - ${COA_ROOT:-/srv/azerothcore-coa}/etc:/azerothcore/env/dist/etc
      - ${COA_ROOT:-/srv/azerothcore-coa}/logs:/azerothcore/env/dist/logs
      - ${COA_ROOT:-/srv/azerothcore-coa}/client-data:/azerothcore/env/dist/data:ro
    networks:
      - coa-network
    depends_on:
      ac-database:
        condition: service_healthy
      ac-db-import:
        condition: service_completed_successfully
      ac-client-data-init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 2m

networks:
  coa-network:
    name: coa-network
